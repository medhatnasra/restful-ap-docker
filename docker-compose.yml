services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

  node-app:
    container_name: express-node-app-container
    image: medhatnasra/restful-api
    volumes:
      - ./src:/app/src:ro
    ports:
      - "4000:3000"
    env_file:
      - ./.env
    depends_on:
      - mongo
  web:
    image: nginx
    ports:
      - "80:80"
    depends_on:
      - node-app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
